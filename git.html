
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira página</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #444;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Olá, mundo!</h1>
        <p>Esta é a minha primeira página HTML.</p>
        <p>Estou a aprender HTML, Git e GitHub.</p>
        <button onclick="alert('Parabéns! A página funciona!')">
            Clica aqui
        </button>
    </div>
</body>
</html>
